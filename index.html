<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #ts {
    font-family: "Courier New", monospace;
    font-size: 48px;
    font-weight: bold;
    color: #ffffff;
    text-shadow: 2px 2px 4px #000000;
  }
</style>
</head>
<body>
  <div id="ts">00:00.000000</div>
  <script>
    const el = document.getElementById("ts");

    // Pythonの起動時刻（ミリ秒）。サーバー側で {{START_EPOCH_MS}} を実際の値に置換する。
    const startEpochMs = {{START_EPOCH_MS}};

    // ページ読み込み時点での「PythonがStartしてからの経過ms」と「JSのperf基点」を記録
    const baseOffsetMs = Date.now() - startEpochMs;
    const perfOrigin   = performance.now();

    function getElapsedSec() {
      return (baseOffsetMs + (performance.now() - perfOrigin)) / 1000;
    }

    function formatTs(sec) {
      const m  = Math.floor(sec / 60);
      const s  = Math.floor(sec % 60);
      const us = Math.floor((sec - Math.floor(sec)) * 1_000_000);
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(us).padStart(6,'0')}`;
    }

    function loop() {
      el.textContent = formatTs(getElapsedSec());
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);
  </script>
</body>
</html>
